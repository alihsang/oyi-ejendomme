<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .building { fill: #1e293b; }
      .accent { fill: #0ea5e9; }
      .window { fill: #0ea5e9; }
      .roof { fill: #06b6d4; }
    }
    @media (prefers-color-scheme: dark) {
      .building { fill: #e2e8f0; }
      .accent { fill: #0284c7; }
      .window { fill: #0284c7; }
      .roof { fill: #0891b2; }
    }
  </style>
  
  <!-- Main building structure -->
  <!-- Roof -->
  <polygon class="roof" points="90,15 160,70 20,70" />
  
  <!-- Main building -->
  <rect class="building" x="25" y="68" width="130" height="105" rx="4" />
  
  <!-- Left tower -->
  <rect class="building" x="8" y="90" width="25" height="83" rx="3" />
  
  <!-- Right tower -->
  <rect class="building" x="147" y="90" width="25" height="83" rx="3" />
  
  <!-- Windows - Main building -->
  <g class="window">
    <rect x="35" y="82" width="14" height="14" rx="2" />
    <rect x="55" y="82" width="14" height="14" rx="2" />
    <rect x="75" y="82" width="14" height="14" rx="2" />
    <rect x="95" y="82" width="14" height="14" rx="2" />
    <rect x="115" y="82" width="14" height="14" rx="2" />
    
    <rect x="35" y="105" width="14" height="14" rx="2" />
    <rect x="55" y="105" width="14" height="14" rx="2" />
    <rect x="75" y="105" width="14" height="14" rx="2" />
    <rect x="95" y="105" width="14" height="14" rx="2" />
    <rect x="115" y="105" width="14" height="14" rx="2" />
    
    <rect x="35" y="128" width="14" height="14" rx="2" />
    <rect x="55" y="128" width="14" height="14" rx="2" />
    <rect x="75" y="128" width="14" height="14" rx="2" />
    <rect x="95" y="128" width="14" height="14" rx="2" />
    <rect x="115" y="128" width="14" height="14" rx="2" />
  </g>
  
  <!-- Windows - Left tower -->
  <rect class="window" x="13" y="102" width="11" height="11" rx="1.5" />
  <rect class="window" x="13" y="125" width="11" height="11" rx="1.5" />
  <rect class="window" x="13" y="148" width="11" height="11" rx="1.5" />
  
  <!-- Windows - Right tower -->
  <rect class="window" x="154" y="102" width="11" height="11" rx="1.5" />
  <rect class="window" x="154" y="125" width="11" height="11" rx="1.5" />
  <rect class="window" x="154" y="148" width="11" height="11" rx="1.5" />
  
  <!-- Door -->
  <rect class="accent" x="80" y="145" width="20" height="28" rx="3" />
  <circle class="building" cx="90" cy="161" r="2" />
</svg>